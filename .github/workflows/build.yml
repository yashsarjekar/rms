name: Python CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Checkout the code from the repository
    - name: Checkout code
      uses: actions/checkout@v2

    # Set up Python
    - name: Set up Python 3.x
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'

    # Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Run the Django development server in the background
    - name: Start Django development server
      run: |
        python manage.py makemigrations
        python manage.py migrate
        python manage.py runserver 0.0.0.0:8000 &
        sleep 5 # Wait for the server to start

    - name: Check server status (running / errors)
      run: |
        curl --fail http://127.0.0.1:8000 || echo "Error: 500 Internal Server Error. Check logs for details."

    - name: View the server logs (for debugging)
      run: |
        tail -n 50 /path/to/django/server/logs # Adjust path accordingly to capture logs